[project]
name = "legacy-protection-risk"
version = "0.1.0"
description = "Risk service for Legacy Protection: rules features, anomaly model and abuse-ring sentinel"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "lightgbm>=4.5", "shap>=0.46", "scikit-learn>=1.5", "numpy>=2", "pyyaml>=6",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "mypy>=1.11", "httpx>=0.27", "types-PyYAML"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["lightgbm.*", "shap.*", "sklearn.*", "joblib.*", "yaml.*"]
ignore_missing_imports = true
